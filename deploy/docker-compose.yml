# yuxm-site 生产编排：nginx / web / api / mysql / redis
# 用法：cd deploy && docker compose up -d
# 首次启动后在 api 容器内执行 python -m app.seed 创建管理员
name: yuxm-site

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-yuxm_site}
      MYSQL_USER: ${MYSQL_USER:-yuxm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # 不对宿主机暴露端口，仅容器网络内访问
    expose:
      - "3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?请在 .env 中设置}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "6379"

  api:
    build:
      context: ../api
    # 镜像名固定为 latest 标签；版本化镜像由 Jenkins 构建为 yuxm-api:<BUILD_NUMBER>，
    # 回滚时把目标版本重新打 latest 标签再 up -d --no-build（见 deploy/scripts/rollback.sh）
    image: yuxm-api:latest
    restart: unless-stopped
    env_file:
      - .env   # 与 compose 变量插值共用同一份 deploy/.env（部署时 cp .env.example deploy/.env）
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
    expose:
      - "8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=3)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ../web
      args:
        API_BASE: http://api:8000
    image: yuxm-web:latest
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_common.conf:/etc/nginx/conf.d/proxy_common.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  # Jenkins CI/CD：挂在宿主机 docker.sock 上，流水线可直接执行 docker/compose 命令
  # 安全提醒：8080 端口请在腾讯云安全组中仅放行自己的 IP，不要对公网开放
  jenkins:
    image: jenkins/jenkins:lts
    restart: unless-stopped
    ports:
      - "8080:8080"    # Web 控制台
      - "50000:50000"  # Agent 通信口
    environment:
      # 2C4G 服务器：限制 JVM 堆内存，避免挤占业务服务
      JAVA_OPTS: -Xmx512m -Xms256m -Duser.timezone=Asia/Shanghai
    volumes:
      - jenkins_data:/var/jenkins_home                    # 任务/插件/凭据持久化
      - /var/run/docker.sock:/var/run/docker.sock         # 流水线构建镜像必需
      - /opt/yuxm-site/deploy:/host-deploy                # 宿主机部署目录：流水线读取 .env、写回滚点状态文件
    user: root                                            # 容器内需 root 才能使用 docker.sock（生产可改 group_add）
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/login || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  mysql_data:
  redis_data:
  jenkins_data:
