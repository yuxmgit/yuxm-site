# yuxm-site Nginx 配置：反代 web/api、gzip、限流、HTTPS（备案后启用 443 段）
# 证书目录：deploy/nginx/certs/（.gitignore 已排除，放入腾讯云免费证书）

# 限流 zone：单 IP 每秒 10 个请求，突发 20；验证码接口单独收紧到 1r/s
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=sms:10m rate=1r/s;
limit_req_status 429;

# HTTP：备案期间用 IP:80 调试；备案通过后重定向到 HTTPS
server {
    listen 80;
    server_name yuxm.site localhost;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1k;
    gzip_comp_level 5;

    # 全站限流
    limit_req zone=general burst=20 nodelay;

    # 验证码发送接口：单独收紧限流（配合后端 IP+手机号双重限频）
    location = /api/auth/sms/send {
        limit_req zone=sms burst=3 nodelay;
        proxy_pass http://api:8000;
        include /etc/nginx/conf.d/proxy_common.conf;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://api:8000;
        include /etc/nginx/conf.d/proxy_common.conf;
    }

    # Nuxt 前端（SSR / 静态资源）
    location / {
        proxy_pass http://web:3000;
        include /etc/nginx/conf.d/proxy_common.conf;
    }
}

